# Copy this file to workflow.conf only when you need to override defaults.

# Executables.
VASPKIT_BIN="vaspkit"
SUBMIT_COMMAND="sbatch"

# Commands and environment setup used by "./workflow.sh run" and Slurm jobs.
# A stage-specific entry overrides [default]. The commands run from the
# corresponding stage directory.
EXECUTION_SETUP=$(cat <<'EOF'
# module purge
# module load vasp
EOF
)
declare -A STAGE_COMMANDS=(
  [default]='mpirun -np "$SLURM_NTASKS" vasp_std'
  # [00_relax]="srun vasp_gam"
  # [01_scf]="srun vasp_std"
  # [02_dos]="srun vasp_std"
  # [03_band]="srun vasp_std"
  # [04_wann]="srun vasp_std"
  # [05_crpa]="srun vasp_std"
)

# Slurm values used by SBATCH_TEMPLATE below.
SBATCH_PARTITION="q_ysuan_384"
SBATCH_NODES=4
SBATCH_NTASKS_PER_NODE=56
SBATCH_CPUS_PER_TASK=1
SBATCH_TIME="24:00:00"
SBATCH_EXTRA=""
#SBATCH_EXTRA="#SBATCH --account=my_account
#SBATCH --qos=normal
#SBATCH --mail-type=END,FAIL
#SBATCH --mail-user=name@example.com"

# Optional cRPA-only Slurm overrides. These inherit the global values unless
# changed, so an expensive cRPA stage can request different resources without
# changing the relaxation, SCF, DOS, band, or Wannier jobs.
CRPA_SBATCH_PARTITION="$SBATCH_PARTITION"
CRPA_SBATCH_NODES="$SBATCH_NODES"
CRPA_SBATCH_NTASKS_PER_NODE="$SBATCH_NTASKS_PER_NODE"
CRPA_SBATCH_CPUS_PER_TASK="$SBATCH_CPUS_PER_TASK"
CRPA_SBATCH_TIME="$SBATCH_TIME"
CRPA_SBATCH_EXTRA="$SBATCH_EXTRA"
CRPA_KPAR="$CRPA_SBATCH_NODES"

# Complete generated job header. Reorder, add, or remove directives here.
# Available tokens are the names shown inside {{...}}.
SBATCH_TEMPLATE=$(cat <<'EOF'
#SBATCH --job-name={{JOB_NAME}}
{{SBATCH_PARTITION_LINE}}
#SBATCH --nodes={{SBATCH_NODES}}
#SBATCH --ntasks-per-node={{SBATCH_NTASKS_PER_NODE}}
#SBATCH --cpus-per-task={{SBATCH_CPUS_PER_TASK}}
#SBATCH --time={{SBATCH_TIME}}
#SBATCH --output=%x-%j.out
#SBATCH --error=%x-%j.err
{{SBATCH_EXTRA}}
source /sh3/ysuanbase/home/yeesuan17060/yeesuan/envs/vasp651_env.sh
EOF
)

# Calculation defaults.
ENCUT="auto"           # 1.30 * largest POTCAR ENMAX, rounded up to 5 eV
ENCUT_FACTOR=1.30
EDIFF=1e-6
EDIFFG=-0.02
ISIF=3                 # use 2 for fixed-cell ionic relaxation
NSW=200
KPR_RELAX=0.03       # VASPKIT task 102 reciprocal resolution
KPR_SCF=0.02
KPR_DOS=0.02
KPR_WANN=0.04
NEDOS=2000
GENERATE_BANDS=yes
RUN_RELAX=yes           # set to no to start directly from the supplied POSCAR

# Complete INCAR templates. Edit each stage here; {{...}} values are filled
# from the calculation defaults above during "workflow.sh prepare".
INCAR_RELAX_TEMPLATE=$(cat <<'EOF'
SYSTEM = {{SYSTEM}}
ENCUT = {{ENCUT}}
PREC = Accurate
EDIFF = {{EDIFF}}
EDIFFG = {{EDIFFG}}
IBRION = 2
ISIF = {{ISIF}}
NSW = {{NSW}}
ISMEAR = 0
SIGMA = 0.05
#LREAL = Auto
#LASPH = .TRUE.
LMAXMIX = 6
LWAVE = .FALSE.
LCHARG = .FALSE.
KPAR = {{SBATCH_NODES}}
EOF
)

INCAR_SCF_TEMPLATE=$(cat <<'EOF'
SYSTEM = {{SYSTEM}} SCF
ENCUT = {{ENCUT}}
PREC = Accurate
EDIFF = {{EDIFF}}
ISMEAR = 0
SIGMA = 0.05
#LREAL = Auto
#LASPH = .TRUE.
LMAXMIX = 6
LORBIT = 10
LWAVE = .TRUE.
LCHARG = .TRUE.
KPAR = {{SBATCH_NODES}}
EOF
)

INCAR_DOS_TEMPLATE=$(cat <<'EOF'
SYSTEM = {{SYSTEM}} DOS
ENCUT = {{ENCUT}}
PREC = Accurate
EDIFF = {{EDIFF}}
ICHARG = 11
ISMEAR = -5
#LREAL = Auto
#LASPH = .TRUE.
LMAXMIX = 6
LORBIT = 10
NEDOS = {{NEDOS}}
LWAVE = .FALSE.
LCHARG = .FALSE.
KPAR = {{SBATCH_NODES}}
EOF
)

INCAR_BAND_TEMPLATE=$(cat <<'EOF'
SYSTEM = {{SYSTEM}} bands
ENCUT = {{ENCUT}}
PREC = Accurate
EDIFF = {{EDIFF}}
ICHARG = 11
ISMEAR = 0
SIGMA = 0.05
#LREAL = Auto
#LASPH = .TRUE.
LMAXMIX = 6
LORBIT = 10
LWAVE = .FALSE.
LCHARG = .FALSE.
KPAR = {{SBATCH_NODES}}
EOF
)

# cRPA is prepared only after 04_wann has finished. These placeholders are
# resolved from the completed Wannier calculation and prepare-crpa arguments:
# {{SYSTEM}}, {{ENCUT}}, {{EDIFF}}, {{NBANDS}}, {{NBANDSGW}},
# {{TARGET_STATES}}, {{ENCUTGW}}, and {{CRPA_KPAR}}.
INCAR_CRPA_TEMPLATE=$(cat <<'EOF'
SYSTEM = {{SYSTEM}} cRPA
ENCUT = {{ENCUT}}
ISMEAR = 0; SIGMA = 0.05
EDIFF = {{EDIFF}}
NBANDS = {{NBANDS}}
NBANDSGW = {{NBANDSGW}}

# SOC can be enabled here when required.
# LSORBIT = .TRUE.
ISYM = -1

LMAXMIX = 6

ALGO = CRPA
NTARGET_STATES = {{TARGET_STATES}}
ENCUTGW = {{ENCUTGW}}

KPAR = {{CRPA_KPAR}}
EOF
)
